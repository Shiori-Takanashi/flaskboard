[project]
name = "flaskboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Takanashi", email = "nao69alter@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask~=3.1.0",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy~=3.1.1",
    "gunicorn>=26.0.0",
    "psycopg[binary]~=3.3.4",
    "sqlalchemy~=2.0.16",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "djlint>=1.46.2",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.19",
    "types-flask-migrate>=4.1.0.20260508",
]

[tool.ruff]
include = [
   "src/flaskboard/*.py",
   "tests/*.py",
   "pyproject.toml"
]
cache-dir = ".ci_cache/.ruff_cache"
target-version = "py312"
line-length = 80

format.skip-magic-trailing-comma = false

lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E501"]

lint.isort.force-single-line = false
lint.isort.lines-after-imports = 2
lint.isort.section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]
lint.isort.order-by-type = true

[tool.mypy]
cache_dir = ".ci_cache/.mypy_cache"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
cache_dir = ".ci_cache/.pytest_cache"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
log_cli = false

[tool.djlint]
profile = "jinja"
ignore = "H030,H031,H023"
indent = 4
max_attribute_length = 70
max_line_length = 90
preserve_leading_space = true
preserve_blank_lines = true
format_attribute_template_tags = true
