services:
  db:
    image: postgres:18.4-trixie
    container_name: flaskboard-postgres
    env_file:
      - .env.postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: flaskboard-app
    env_file: .env.flask
    depends_on:
      db:
       condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
