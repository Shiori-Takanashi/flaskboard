services:
  db:
    image: postgres:18.4-trixie
    container_name: flaskboard-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: flaskboard-app
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      DATABASE_HOST_NAME: "${DATABASE_HOST_NAME:?DATABASE_HOST_NAME is required}"
      DATABASE_PORT: "${DATABASE_PORT:?DATABASE_PORT is required}"
      APP_BIND_ADDRESS: "${APP_BIND_ADDRESS:?APP_BIND_ADDRESS is required}"
      APP_BIND_PORT: "${APP_BIND_PORT:?APP_BIND_PORT is required}"
      APP_PUBLISHED_PORT: "${APP_PUBLISHED_PORT:?APP_PUBLISHED_PORT is required}"
      GUNICORN_CMD_ARGS: "--bind=${APP_BIND_ADDRESS}:${APP_BIND_PORT}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PUBLISHED_PORT}:${APP_BIND_PORT}"

volumes:
  postgres_data:
