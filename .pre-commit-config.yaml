repos:
  - repo: local
    hooks:
      - id: ruff-modify
        name: ruff-modify
        entry: bash -c "uv run ruff check --fix && uv run ruff format"
        language: system
        types_or: [python, pyi, pyproject]

  - repo: local
    hooks:
      - id: ruff-verify
        name: ruff-verify
        entry: bash -c "uv run ruff check && uv run ruff format --check"
        language: system
        types_or: [python, pyi, pyproject]

  - repo: local
    hooks:
      - id: jinja-modify
        name: jinja-modify
        entry: >
          bash -c '
            templates="src/flaskboard/templates";
            uv run djlint - --reformat &&
            uv run djhtml --tabwidth 4 "$templates"
          '
        language: system
        files: ^src/flaskboard/templates/.*\.html$
        pass_filenames: false

  - repo: local
    hooks:
      - id: jinja-verify
        name: jinja-verify
        entry: >
          bash -c '
            templates="src/flaskboard/templates";
            uv run djlint - --lint &&
            uv run djhtml --check --tabwidth 4 "$templates"
          '
        language: system
        files: ^src/flaskboard/templates/.*\.html$

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi, jupyter]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
